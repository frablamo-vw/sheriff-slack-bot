display_information:
  name: Sheriff Rotation
  description: Assigns the weekly sheriff while respecting vacation statuses.
  background_color: "#2c3e50"
features:
  bot_user:
    display_name: Sheriff Rotation
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - groups:read
      - users.profile:read
      - users:read
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
